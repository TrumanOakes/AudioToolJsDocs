<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nexus Architecture Diagrams</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #ffffff;
    color: #111827;
    padding: 16px;
  }
  .slide-counter {
    text-align: center;
    font-size: 13px;
    color: #6b7280;
    margin-bottom: 8px;
  }
  .slide-header {
    text-align: center;
    margin-bottom: 12px;
  }
  .slide-title {
    font-size: 18px;
    font-weight: bold;
    color: #111827;
  }
  .slide-subtitle {
    font-size: 13px;
    color: #6b7280;
    margin-top: 4px;
  }
  .slide-area {
    width: 100%;
    height: 420px;
    background: #f9fafb;
    border: 1px solid #e5e7eb;
    border-radius: 8px;
    overflow: hidden;
    position: relative;
  }
  .slide-area svg {
    display: none;
    width: 100%;
    height: 100%;
  }
  .slide-area svg.active {
    display: block;
  }
  .nav-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    margin-top: 12px;
  }
  .nav-btn {
    font-size: 13px;
    color: #374151;
    background: none;
    border: 1px solid #d1d5db;
    border-radius: 6px;
    padding: 6px 14px;
    cursor: pointer;
    transition: none;
  }
  .nav-btn:disabled {
    color: #d1d5db;
    border-color: #e5e7eb;
    cursor: default;
  }
  .dots {
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #d1d5db;
    cursor: pointer;
    border: none;
    padding: 0;
  }
  .dot.active {
    background: #3b82f6;
  }
  /* Card styles used in SVGs via foreignObject — kept here as reference */
</style>
</head>
<body>

<div class="slide-counter" id="counter">1 / 5</div>
<div class="slide-header">
  <div class="slide-title" id="slide-title"></div>
  <div class="slide-subtitle" id="slide-subtitle"></div>
</div>

<div class="slide-area" id="slide-area">

  <!-- SLIDE 1: Document Types -->
  <svg id="slide-1" class="active" viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg">
    <!-- Left card: SyncedDocument -->
    <rect x="30" y="20" width="340" height="260" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
    <rect x="30" y="20" width="4" height="260" rx="2" fill="#3b82f6"/>
    <!-- Badge -->
    <text x="46" y="48" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#3b82f6" font-weight="bold" letter-spacing="1">LIVE · MULTI-USER · PERSISTED</text>
    <!-- Title -->
    <text x="46" y="74" font-family="'Courier New',Courier,monospace" font-size="15" fill="#111827" font-weight="bold">SyncedDocument</text>
    <!-- Body text -->
    <text x="46" y="100" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="13" fill="#374151">Connects to a real Audiotool project.</text>
    <text x="46" y="118" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="13" fill="#374151">Changes are broadcast to all</text>
    <text x="46" y="136" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="13" fill="#374151">collaborators in real time.</text>
    <!-- Creation method -->
    <rect x="46" y="152" width="298" height="32" rx="4" fill="#eff6ff"/>
    <text x="58" y="172" font-family="'Courier New',Courier,monospace" font-size="12" fill="#1d4ed8">client.createSyncedDocument(...)</text>
    <!-- Requires note -->
    <rect x="46" y="196" width="298" height="28" rx="4" fill="#fafafa" stroke="#e5e7eb" stroke-width="1"/>
    <text x="58" y="214" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="12" fill="#6b7280">Requires document.start() before use</text>

    <!-- Right card: OfflineDocument -->
    <rect x="430" y="20" width="340" height="260" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
    <rect x="430" y="20" width="4" height="260" rx="2" fill="#6b7280"/>
    <!-- Badge -->
    <text x="446" y="48" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#6b7280" font-weight="bold" letter-spacing="1">LOCAL · TESTING · NO BACKEND</text>
    <!-- Title -->
    <text x="446" y="74" font-family="'Courier New',Courier,monospace" font-size="15" fill="#111827" font-weight="bold">OfflineDocument</text>
    <!-- Body text -->
    <text x="446" y="100" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="13" fill="#374151">Runs entirely in memory with no</text>
    <text x="446" y="118" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="13" fill="#374151">backend. Changes are lost on reload.</text>
    <text x="446" y="136" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="13" fill="#374151">No start() required.</text>
    <!-- Creation method -->
    <rect x="446" y="152" width="298" height="32" rx="4" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
    <text x="458" y="172" font-family="'Courier New',Courier,monospace" font-size="12" fill="#374151">createOfflineDocument()</text>
    <!-- No-op note -->
    <rect x="446" y="196" width="298" height="28" rx="4" fill="#fafafa" stroke="#e5e7eb" stroke-width="1"/>
    <text x="458" y="214" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="12" fill="#6b7280">No start() / stop() lifecycle</text>

    <!-- Note at bottom -->
    <rect x="30" y="300" width="740" height="50" rx="6" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1"/>
    <text x="50" y="322" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="13" fill="#374151">Both expose the same</text>
    <text x="163" y="322" font-family="'Courier New',Courier,monospace" font-size="13" fill="#1d4ed8">modify()</text>
    <text x="218" y="322" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="13" fill="#374151">,</text>
    <text x="224" y="322" font-family="'Courier New',Courier,monospace" font-size="13" fill="#1d4ed8">events</text>
    <text x="267" y="322" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="13" fill="#374151">, and</text>
    <text x="303" y="322" font-family="'Courier New',Courier,monospace" font-size="13" fill="#1d4ed8">queryEntities</text>
    <text x="395" y="322" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="13" fill="#374151">API — code written against one works against the other.</text>
  </svg>

<div class="nav-row">
  <button class="nav-btn" id="prev-btn" onclick="navigate(-1)">← Prev</button>
  <div class="dots" id="dots"></div>
  <button class="nav-btn" id="next-btn" onclick="navigate(1)">Next →</button>
</div>

<script>
  const slides = [
    { title: "Document Types",     subtitle: "Two modes, one API" },
    { title: "Entity Structure",   subtitle: "Everything in a project is an entity" },
    { title: "Audio Signal Flow",  subtitle: "How audio travels through a project" },
    { title: "Pointer References", subtitle: "How entities reference each other by ID" },
    { title: "Timeline Structure", subtitle: "How notes and regions are organized" }
  ];

  let current = 0;

  const dotsEl   = document.getElementById('dots');
  const counterEl = document.getElementById('counter');
  const titleEl   = document.getElementById('slide-title');
  const subtitleEl = document.getElementById('slide-subtitle');
  const prevBtn   = document.getElementById('prev-btn');
  const nextBtn   = document.getElementById('next-btn');

  // Build dots
  slides.forEach((_, i) => {
    const dot = document.createElement('button');
    dot.className = 'dot' + (i === 0 ? ' active' : '');
    dot.setAttribute('aria-label', 'Go to slide ' + (i + 1));
    dot.addEventListener('click', () => goTo(i));
    dotsEl.appendChild(dot);
  });

  function goTo(n) {
    // Hide current SVG
    document.getElementById('slide-' + (current + 1)).classList.remove('active');
    dotsEl.children[current].classList.remove('active');

    current = n;

    // Show new SVG
    document.getElementById('slide-' + (current + 1)).classList.add('active');
    dotsEl.children[current].classList.add('active');

    // Update header
    counterEl.textContent = (current + 1) + ' / ' + slides.length;
    titleEl.textContent    = slides[current].title;
    subtitleEl.textContent = slides[current].subtitle;

    // Update buttons
    prevBtn.disabled = current === 0;
    nextBtn.disabled = current === slides.length - 1;
  }

  function navigate(dir) {
    const next = current + dir;
    if (next >= 0 && next < slides.length) goTo(next);
  }

  // Initialize
  goTo(0);
</script>
