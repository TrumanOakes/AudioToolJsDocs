<style>
/* Tooltip/hover explanation pattern for glossary terms */
.tooltip {
  position: relative;
  cursor: help;
  border-bottom: 1px dotted currentColor;
  display: inline;
}

.tooltip::after {
  content: attr(data-tooltip);
  position: absolute;
  bottom: 125%;
  left: 50%;
  transform: translateX(-50%);
  background: #1e2126;
  color: #e0e0e0;
  padding: 6px 10px;
  border-radius: 4px;
  font-size: 0.8rem;
  line-height: 1.5;
  width: 270px;
  text-align: left;
  white-space: normal;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.15s ease;
  z-index: 9999;
  border: 1px solid #444;
}

.tooltip:hover::after {
  opacity: 1;
}
</style>
