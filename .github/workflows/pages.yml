name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master
      - "claude/github-pages-deployment-SPyTT"
      - "claude/install-audiotool-nexu-RI2hZ"
      - "cursor/split-docs-api-tabs-f90d"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Clone nexus source
        run: git clone --depth 1 https://github.com/audiotool/nexus.git /tmp/nexus-src

      - name: Install nexus dependencies
        run: npm ci
        working-directory: /tmp/nexus-src

      - name: Install docs tools
        run: npm ci

      - name: Generate API reference
        run: npm run docs

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
